# Conda env for Experiment 1 (agentic token consumption) — runs LOCALLY (macOS arm64).
#
#   conda env create -f environment.yml
#   conda activate token-energy-exp1
#
# Experiment 2 (vLLM throughput on Sherlock H100/A100) needs CUDA + vLLM, which do not
# install on macOS arm64 — it gets its own env on Sherlock (exp2_throughput/, created later).
#
# API orchestration runs here on the Mac; the Docker-based SWE-bench / SWE-Lancer GRADING
# runs on a Docker-capable Linux box (see PLAN.md open item #1) — not on this Mac.
name: token-energy-exp1
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # --- Provider SDKs + unified routing -------------------------------------
      - litellm>=1.55            # one token-accounting path for Claude / GPT / Gemini
      - anthropic>=0.40
      - openai>=1.50
      - google-generativeai>=0.8
      # --- Agent scaffold (SWE-bench Lite / Verified) --------------------------
      - mini-swe-agent           # lightweight, token-transparent; routes via litellm
      # --- Benchmark datasets + grading harness --------------------------------
      - swebench>=3.0            # dataset loaders + evaluation harness (grading on Linux)
      - datasets>=2.20           # HuggingFace dataset access (SWE-bench, SWE-Lancer)
      - huggingface-hub>=0.25
      # --- Token counting / cost instrumentation -------------------------------
      - tiktoken                 # rough offline token estimates for the dry-run projector
      # --- Data handling + CLI ergonomics --------------------------------------
      - pandas>=2.0
      - numpy>=1.26
      - python-dotenv>=1.0       # loads Experiment/.env
      - tqdm>=4.66
      - rich>=13.0               # readable cost tables / progress
